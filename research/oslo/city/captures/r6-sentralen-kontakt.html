<script>
  function updateNavScrollClass() {
    const navs = document.querySelectorAll('.nav_component');
    const isScrolled = window.scrollY >= 16;

    const isAnyDropdownOpen =
          document.querySelectorAll('.w-dropdown.w--open, .w-dropdown-toggle.w--open, .w-dropdown-list.w--open').length > 0;

    const isMobileMenuOpen =
          document.querySelectorAll('.w-nav-button.w--open, .w-nav.w--open, .w-nav-overlay[style*="display: block"]').length > 0;

    const shouldAdd = isScrolled || isAnyDropdownOpen || isMobileMenuOpen;

    navs.forEach(nav => nav.classList.toggle('is-scroll', shouldAdd));
  }

  function scheduleUpdate() {
    setTimeout(updateNavScrollClass, 0);
  }

  window.addEventListener('scroll', updateNavScrollClass);
  window.addEventListener('load', updateNavScrollClass);
  document.addEventListener('click', scheduleUpdate, true);
  document.addEventListener('touchend', scheduleUpdate, true);
  document.addEventListener('keydown', scheduleUpdate, true);

  document.addEventListener('DOMContentLoaded', function () {
    const root = document.body;

    const observer = new MutationObserver(function (mutations) {
      for (let i = 0; i < mutations.length; i++) {
        const m = mutations[i];
        if (m.type === 'attributes' && m.attributeName === 'class') {
          const el = m.target;
          if (
            el.classList &&
            (
              el.classList.contains('w-dropdown') ||
              el.classList.contains('w-dropdown-toggle') ||
              el.classList.contains('w-dropdown-list') ||
              el.classList.contains('w-nav-button') ||
              el.classList.contains('w-nav') ||
              el.classList.contains('w-nav-overlay')
            )
          ) {
            updateNavScrollClass();
            return;
          }
        }
      }
    });

    observer.observe(root, { attributes: true, subtree: true, attributeFilter: ['class', 'style'] });
    updateNavScrollClass();
  });
</script>
<!-- End Navigation Background -->

<!-- Navigation Dropdowns -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('[nav_dropdown="parent"]').forEach(function (parent) {
      const links = parent.querySelectorAll('[nav_dropdown_link]');
      const subs = parent.querySelectorAll('[nav_dropdown_sub]');
      const backBtn = parent.querySelector('[nav_dropdown="back"]');
      const content = parent.querySelector('[nav_dropdown="content"]');
      const large = parent.querySelector('[nav_dropdown="large"]');
      const contents = parent.querySelectorAll('[nav_dropdown="content"],[nav_dropdown="large"],[nav_dropdown="sub"]');

      function setLinkStates(activeLink) {
        links.forEach(function (link) {
          const isActive = activeLink && link === activeLink;
          link.classList.toggle('is-active', isActive);
          link.classList.toggle('is-inactive', !!activeLink && !isActive);
        });
      }

      function syncContentHeightToSub(activeValue) {
        if (!content || !large) return;

        const subContainer = parent.querySelector('[nav_dropdown="sub"]');
        if (!subContainer) return;

        let hasMatch = false;

        subs.forEach(function (sub) {
          if (sub.getAttribute('nav_dropdown_sub') === activeValue) {
            hasMatch = true;
          }
        });

        if (!hasMatch) return;

        const subHeight = subContainer.scrollHeight;
        const largeHeight = large.scrollHeight;
        const targetHeight = Math.max(largeHeight, subHeight);

        content.style.minHeight = targetHeight + 'px';
      }

      function resetContentHeight() {
        if (content) content.style.minHeight = '';
      }

      function resetState() {
        contents.forEach(function (el) {
          el.classList.remove('is-sub');
        });

        subs.forEach(function (sub) {
          sub.classList.add('is-inactive');
        });

        links.forEach(function (link) {
          link.classList.remove('is-active');
          link.classList.remove('is-inactive');
        });

        resetContentHeight();
      }

      function showOnlySub(value) {
        subs.forEach(function (sub) {
          const match = sub.getAttribute('nav_dropdown_sub') === value;
          sub.classList.toggle('is-inactive', !match);
        });
      }

      function isDropdownOpen(dropdownEl) {
        if (!dropdownEl) return false;
        const toggle = dropdownEl.querySelector('.w-dropdown-toggle');
        const list = dropdownEl.querySelector('.w-dropdown-list');
        return (
          dropdownEl.classList.contains('w--open') ||
          (toggle && toggle.classList.contains('w--open')) ||
          (list && list.classList.contains('w--open'))
        );
      }

      resetState();

      links.forEach(function (link) {
        link.addEventListener(
          'click',
          function (e) {
            const value = link.getAttribute('nav_dropdown_link');
            if (!value) return;

            const isMobile = window.matchMedia('(max-width: 991px)').matches;

            if (value !== 'single') {
              if (isMobile) {
                e.preventDefault();
                e.stopPropagation();
                if (typeof e.stopImmediatePropagation === 'function') {
                  e.stopImmediatePropagation();
                }
              }

              setLinkStates(link);
              showOnlySub(value);
              contents.forEach(function (el) {
                el.classList.add('is-sub');
              });
              syncContentHeightToSub(value);
            }
          },
          true
        );
      });

      if (backBtn) {
        backBtn.addEventListener(
          'click',
          function (e) {
            const isMobile = window.matchMedia('(max-width: 991px)').matches;
            if (isMobile) {
              e.preventDefault();
              e.stopPropagation();
              if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
              }
            }
            resetState();
          },
          true
        );
      }

      const dropdown = parent.closest('.w-dropdown');
      if (!dropdown) return;

      const targets = [
        dropdown,
        dropdown.querySelector('.w-dropdown-toggle'),
        dropdown.querySelector('.w-dropdown-list')
      ].filter(Boolean);

      const observer = new MutationObserver(function () {
        if (!isDropdownOpen(dropdown)) resetState();
      });

      targets.forEach(function (t) {
        observer.observe(t, {
          attributes: true,
          attributeFilter: ['class', 'style']
        });
      });

      document.addEventListener(
        'click',
        function () {
          setTimeout(function () {
            if (!isDropdownOpen(dropdown)) resetState();
          }, 0);
        },
        true
      );

      document.addEventListener(
        'keydown',
        function (e) {
          if (e.key === 'Escape') {
            setTimeout(function () {
              if (!isDropdownOpen(dropdown)) resetState();
            }, 0);
          }
        },
        true
      );
    });
  });
</script>
<!-- End Navigation Dropdowns -->

<!-- Dynamic Opening Hours -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const dayNames = [
      "sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"
    ];

    const parseDate = (str) => {
      const [day, month, year] = str.split(".");
      return new Date(`${year}-${month}-${day}T00:00:00`);
    };

    const formatDate = (date) => {
      return date.toISOString().split("T")[0];
    };

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const todayFormatted = formatDate(today);
    const todayDayName = dayNames[today.getDay()];

    const allGroups = document.querySelectorAll('[opening-hours_category]');
    const exceptions = [];

    document.querySelectorAll('[opening-hours-exception="item"]').forEach((exceptionItem) => {
      const message = exceptionItem.querySelector('[opening-hours-exception="message"]')?.textContent?.trim();
      const startDateStr = exceptionItem.querySelector('[opening-hours-exception="start-date"]')?.textContent?.trim();
      const endDateStr = exceptionItem.querySelector('[opening-hours-exception="end-date"]')?.textContent?.trim();

      if (!startDateStr) return;
      const startDate = parseDate(startDateStr);
      const endDate = endDateStr ? parseDate(endDateStr) : startDate;

      const startFormatted = formatDate(startDate);
      const endFormatted = formatDate(endDate);

      if (todayFormatted < startFormatted || todayFormatted > endFormatted) return;

      const categoryEls = exceptionItem.querySelectorAll('[opening-hours-exception="category"]');
      if (!categoryEls.length) return;

      const categories = Array.from(categoryEls).map(el => el.textContent.trim());

      categories.forEach(category => {
        exceptions.push({ category, message });
      });
    });

    allGroups.forEach(group => {
      const category = group.getAttribute('opening-hours_category');
      const allTimes = group.querySelectorAll('.hours_time');
      allTimes.forEach(el => el.style.display = 'none');

      const exception = exceptions.find(e => e.category === category);

      if (exception) {
        const el = group.querySelector(`.hours_time[opening-hours="${todayDayName}"]`);
        if (el) {
          el.textContent = exception.message;
          el.style.display = 'inline';
        }
      } else {
        const todayTime = group.querySelector(`.hours_time[opening-hours="${todayDayName}"]`);
        if (todayTime) {
          let text = todayTime.textContent.trim();
          if (text.includes("-")) {
            text = text.replace(/(\d{2}:\d{2})-(\d{2}:\d{2})/, "$1 - $2");
            todayTime.textContent = text;
          }
          todayTime.style.display = 'inline';
        }
      }
    });
  });
</script>
<!-- End Dynamic Opening Hours --></body></html>
