    <!-- Analytics gate. Both the Google tag and the Meta Pixel below read this flag.

         Why: neither vendor snippet checked where it was running, so this GA
         property and this Pixel also collected `npm run dev` on localhost, every
         Netlify deploy preview, and the staging branch deploy. Headless browsers
         execute JS and so reached both as well. On 2026-09-15, 419 of 466 GA
         "users" shared a single scripted viewport (1280x1200, 0s engagement)
         out of a Singapore datacentre, dragging site-wide engagement rate down
         to 4.84%. Netlify's server-side numbers put non-browser traffic at
         96.3%, so unfiltered client analytics only drifts further from reality.

         The hostname check is always on: nothing wants localhost or a preview
         deploy reporting into the production property. The bot filter is
         switchable, via VITE_ANALYTICS_BOT_FILTER in the Netlify build
         environment. Set it to "false" and redeploy to count automated clients
         again, for example to compare like for like against figures recorded
         before this shipped.

         Vite substitutes %VITE_*% in index.html at build time. When the
         variable is unset the placeholder survives verbatim, so it cannot
         equal "false" and the filter stays on. Unset fails safe. -->
    <script>
      (function () {
        var host = location.hostname;
        var isProduction = host === 'gmasia.ai' || host === 'www.gmasia.ai';

        // Chrome sets `navigator.webdriver` when it is driven over the DevTools
        // protocol (Puppeteer, Playwright, Selenium). The UA test catches
        // headless builds that leave the flag unset.
        var botFilterOff = "%VITE_ANALYTICS_BOT_FILTER%" === "false";

        var isAutomated =
          !botFilterOff &&
          (navigator.webdriver === true || /Headless/i.test(navigator.userAgent));

        window.__ANALYTICS_ENABLED__ = isProduction && !isAutomated;
      })();
    </script>

    <!-- Google tag (gtag.js) -->

      if (window.__ANALYTICS_ENABLED__) {

        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-K0CJ7DP2BM');

        var gaTag = document.createElement('script');
        gaTag.async = true;
        gaTag.src = 'https://www.googletagmanager.com/gtag/js?id=G-K0CJ7DP2BM';
        document.head.appendChild(gaTag);
      }
    </script>
